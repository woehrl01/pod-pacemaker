# github action which runs a make script to setup go

name: Go

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/**"
  release:
    types: [published] # publishing a draft fires "published", not "created"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        # release: tag without "v" (v1.9.0 -> 1.9.0); otherwise a dev version for the e2e test only
        run: |
          VERSION="${TAG#v}"
          echo "version=${VERSION:-0.0.0-dev.${{ github.run_number }}}" >> "$GITHUB_OUTPUT"
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Run make
        run: |
          VERSION=${{ steps.version.outputs.version }} make docker-build

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: kind

      - name: Load Image into Kind Cluster and deploy
        run: |
          VERSION=${{ steps.version.outputs.version }} make kind-load
          VERSION=${{ steps.version.outputs.version }} make kind-deploy

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.15

      - name: Run Chainsaw Test
        run: chainsaw test --skip-delete=true e2e

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Image
        if: github.event_name == 'release'
        run: |
          VERSION=${{ steps.version.outputs.version }} make docker-push
      - name: Publish Helm Chart
        if: github.event_name == 'release'
        run: |
          VERSION=${{ steps.version.outputs.version }} make helm-push
