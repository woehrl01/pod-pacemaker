taintToRemove: pod-pacemaker

debugLogging: false
cni:
  maxWaitTimeInSeconds: 120 # maximum is 220 seconds because of the default CNI timeout of 4 minutes
  successOnConnectionTimeout: true
  mergedName: 00-merged-pod-pacemaker.conflist
  disableThrottle: false
  # how often the merged configuration is re-synced with the primary CNI configuration; empty or a zero duration (0, 0s, 0m, ...) disables it
  watchInterval: 10s

daemon:
  socketFile: /var/run/pod-pacemaker/pod-pacemaker.sock
  socketPath: /var/run/pod-pacemaker
  metricsEnabled: true
  skipDaemonsets: true
  metricsPort: 9000
  trackInflightRequests: false
  # release a slot held longer than this (a pod stuck in a state not detected as failed); 0s never does
  maxSlotHold: 0s

podAnnotations: {}
podLabels: {}
priorityClassName: "system-node-critical"

image:
  repository: ghcr.io/woehrl01/pod-pacemaker
  pullPolicy: IfNotPresent

nodeSelector: {}

resources: {}

tolerations: 
  - effect: "NoSchedule"
    operator: "Exists"
  - effect: "NoExecute"
    operator: "Exists"

affinity: {}

namespaceExclusions: 
  - kube-system

defaultThrottleConfig:
  enabled: true
  config:
    maxConcurrent:
      perCore: "0.5"
