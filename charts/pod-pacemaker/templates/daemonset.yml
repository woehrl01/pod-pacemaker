apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-pacemaker
  labels:
    app.kubernetes.io/name: pod-pacemaker
    app.kubernetes.io/instance: pod-pacemaker
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  selector:
    matchLabels:
      name: pod-pacemaker
  template:
    metadata:
      labels:
        name: pod-pacemaker
        app.kubernetes.io/name: pod-pacemaker
        app.kubernetes.io/instance: pod-pacemaker
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        {{- with .Values.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{ end }}
      annotations:
        pod-pacemaker/skip: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.daemon.metricsPort }}"
        {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{ end }}
    spec:
      serviceAccountName: pod-pacemaker
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{ end }}
      initContainers:
        - name: init-cni
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "./cni-init"
          args:
            {{- include "pod-pacemaker.cniInitArgs" . | nindent 12 }}
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /opt/cni/bin
            - name: cni-config-dir
              mountPath: /etc/cni/net.d
            - name: pod-pacemaker-socket
              mountPath: {{ .Values.daemon.socketPath }}
      containers:
        {{- if .Values.cni.watchInterval }}
        # re-merges the CNI configuration whenever the primary CNI rewrites its own
        - name: cni-config-sync
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "./cni-init"
          args:
            {{- include "pod-pacemaker.cniInitArgs" . | nindent 12 }}
            - "--watch-interval={{ .Values.cni.watchInterval }}"
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /opt/cni/bin
            - name: cni-config-dir
              mountPath: /etc/cni/net.d
        {{- end }}
        - name: node-daemon
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "./node-daemon"
          args:
            - "--taint-to-remove={{ .Values.taintToRemove }}"
            - "--daemon-socket={{ .Values.daemon.socketFile }}"
            - "--debug-logging={{ .Values.debugLogging }}"
            - "--metrics-port={{ .Values.daemon.metricsPort }}"
            - "--metrics-enabled={{ .Values.daemon.metricsEnabled }}"
            - "--skip-daemonsets={{ .Values.daemon.skipDaemonsets }}"
            - "--track-inflight-requests={{ .Values.daemon.trackInflightRequests }}"
            - "--max-slot-hold={{ .Values.daemon.maxSlotHold }}"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: {{ .Values.daemon.metricsPort }}
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{ toYaml . | nindent 12 }}
          {{ end }}
          volumeMounts:
            - name: pod-pacemaker-socket
              mountPath: {{ .Values.daemon.socketPath }}
      tolerations:
        - key: {{ .Values.taintToRemove }}
          effect: NoSchedule
        {{- with .Values.tolerations }}
        {{ toYaml . | nindent 8 }}
        {{ end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-config-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: pod-pacemaker-socket
          hostPath:
            path: {{ .Values.daemon.socketPath }}
            type: DirectoryOrCreate
